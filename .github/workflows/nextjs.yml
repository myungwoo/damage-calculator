# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 포맷 · 린트 · 타입 · 테스트. PR과 똑같은 검사를 배포 전에도 통과해야 한다.
  checks:
    uses: ./.github/workflows/ci.yml

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      # static_site_generator: next 를 쓰지 않는 이유:
      # 그 옵션은 액션이 next.config.js 를 새로 만들어 basePath 와 output 을 주입하는데,
      # Next 는 next.config.js 를 next.config.ts 보다 먼저 읽으므로 이 리포의
      # next.config.ts 가 조용히 무시된다. 설정이 두 곳으로 갈라지지 않도록
      # basePath / 정적 내보내기는 next.config.ts 가 직접 관리하고,
      # 하위 경로만 아래 빌드 단계에서 환경변수로 넘긴다.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        env:
          # 프로젝트 페이지는 /<repo> 하위 경로에 붙는다.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # 통합 사이트(mapleland.myungwoo.kr)는 이 리포의 푸시를 감지하지 못한다.
      # 배포가 끝났다고 알려 줘야 그쪽도 최신 코드로 다시 빌드한다.
      # 시크릿이 없으면 조용히 넘어간다(시크릿 등록 전이거나 포크인 경우).
      - name: Notify mapleland-utils
        env:
          TOKEN: ${{ secrets.MAPLELAND_UTILS_DISPATCH }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "MAPLELAND_UTILS_DISPATCH 시크릿이 없어 알리지 않았습니다."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/myungwoo/mapleland-utils/dispatches \
            -d "$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
                  '{event_type:"utils-updated",client_payload:{repo:$repo,sha:$sha}}')"
          echo "mapleland-utils 재빌드를 요청했습니다."
